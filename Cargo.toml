[package]
name = "whyhot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A deterministic terminal heat-source diagnostic for macOS"
authors = ["Duncan Trevithick"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/dunctk/whyhot"
homepage = "https://github.com/dunctk/whyhot"
keywords = ["macos", "tui", "diagnostics", "cpu", "thermal"]
categories = ["command-line-utilities"]
exclude = [".github/"]

[[bin]]
name = "whyhot"
path = "src/main.rs"

[dependencies]
libc = "0.2.172"
sysinfo = "0.33.1"

[profile.release]
lto = "thin"
strip = true
